<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodExpress</title>
    <link rel="stylesheet" href="loginform.css">
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <a href="index.html" class="logo">🍔 Yum Yum Express</a>
        <ul class="nav-links">
            <li><a href="index.html#offers">Offers</a></li>
            <li><a href="index.html#help">Help</a></li>
        </ul>
    </div>
</nav>

<section class="login-section">
    <div class="login-card">
        <h2>Login to your account</h2>
        <form class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login submit-btn">Login</button>

            <p class="login-helper">
                Don't have an account? <a href="#">Sign up</a>
            </p>
        </form>
    </div>
</section>

</body>
</html>
